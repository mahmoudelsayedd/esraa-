<!-- ===================== عدّل هنا فقط (الجزء 1: الرسالة والتعليقات والصور) =====================
     - الرسالة اللي تحت القلب: --msg
     - تعليق كل صورة: --cap1 لحد --cap6  
     - الصور (base64) موجودة في آخر الملف جوه <style id="photos"> --photo1 لحد --photo6 بنفس ترتيب التعليقات.
     - لو فيه علامة " جوه النص اكتبها \"  -->
<style id="config-text">
:root{
  --msg:"اليوم يحتضن ذكرى حبنا , الف حمد وشكر لله الي جابك لدنيتي وجمعني بيكي وبقيتي مني وليا ديما , بحبك يا اغلى ما ليا";
  --cap1:"كل سنه وانتي كل حاجه حلوه ليا";
  --cap2:"كل سنه وانا مطلع عينك وقارفك وعلى قلبك";
  --cap3:"كل سنه وانتي اقربلي من نفسي";
  --cap4:"كل سنه وانتي حياتي وروحي";
  --cap5:"كل سنه وانتي اجمل حاجه فحياتي";
  --cap6:"كل سنه وانتي الحاجه الوحيده الي مخلياني اكمل";
}
</style>
<!-- ===================== (الجزء 2: تاريخ بداية القصة) =====================
     بصيغة YYYY-MM-DD. لينك الأغنية في آخر الصفحة (ابحث عن youtu.be). -->
<script>
window.CONFIG={
  START_DATE:"2025-10-28"
};
</script>
<!-- ===================== نهاية الجزء اللي بتعدله ===================== -->

<style>
:root{--bg:#fbf5ec;--rose:#f3d9d6;--dust:#b9707a;--deep:#6e1f34;--gold:#b08a4e;--ink:#6e1f34;--mute:#7d4553;--card:#fffaf3;--btn-bg:#6e1f34;--btn-fg:#fbf5ec;--pt1:#b9707a;--pt2:#b08a4e;--sh:rgba(110,31,52,.18)}
@media(prefers-color-scheme:dark){:root{--bg:#1c0d14;--rose:#3a1a26;--dust:#e3a1aa;--deep:#f3d9d6;--gold:#d1ac6e;--ink:#f6e9df;--mute:#d9b8bd;--card:#2a1420;--btn-bg:#f3d9d6;--btn-fg:#6e1f34;--pt1:#e3a1aa;--pt2:#d9b57a;--sh:rgba(0,0,0,.5)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.9 Tajawal,"Segoe UI",Tahoma,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.en{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-style:italic;direction:ltr;unicode-bidi:isolate}

/* الشاشة الافتتاحية (checkbox + label: تشتغل من غير جافا سكريبت) */
#open{position:fixed;top:0;opacity:0;width:1px;height:1px}
.intro{position:fixed;inset:0;z-index:20;display:grid;place-content:center;justify-items:center;gap:1.1rem;text-align:center;padding:calc(2rem + env(safe-area-inset-top)) 1.5rem calc(2rem + env(safe-area-inset-bottom));background:radial-gradient(120% 80% at 50% 0,var(--rose),var(--bg) 70%);transition:opacity .9s,visibility .9s}
.intro .name{margin:0;font-size:clamp(2.6rem,12vw,4.2rem);line-height:1.1;color:var(--deep)}
.intro .line{margin:0 0 .6rem;font:400 1.35rem/1.8 Amiri,"Traditional Arabic",serif;color:var(--mute)}
.btn{display:inline-block;cursor:pointer;padding:.8rem 2.1rem;border-radius:999px;background:var(--btn-bg);color:var(--btn-fg);font:700 1.05rem Tajawal,sans-serif;text-decoration:none;box-shadow:0 8px 24px var(--sh);transition:transform .2s}
.btn:active{transform:scale(.97)}
#open:focus-visible~.intro .btn{outline:3px solid var(--gold);outline-offset:4px}
#open:checked~.intro{opacity:0;visibility:hidden;pointer-events:none}
#open:not(:checked)~.site{display:none}

/* الشاشة الرئيسية */
.hero{display:grid;justify-items:center;text-align:center;padding:2.5rem 1.25rem 0}
.hero .name{margin:0;font-size:1.7rem;color:var(--dust)}
.count{margin:.2rem 0 0;font:400 1.4rem/1.4 Amiri,"Traditional Arabic",serif;color:var(--mute)}
.count b{display:block;font:700 clamp(3.6rem,17vw,5.4rem)/1.1 Amiri,"Traditional Arabic",serif;color:var(--deep)}
.clock{display:flex;justify-content:center;gap:1.2rem;margin-top:.4rem;font:400 1.1rem/1.5 Amiri,"Traditional Arabic",serif;color:var(--mute)}
.clock i{padding-inline-end:.25em;font:700 1.5rem Amiri,"Traditional Arabic",serif;font-style:normal;color:var(--dust)}
.stage{position:relative;width:min(88vw,420px);aspect-ratio:1;margin:.6rem auto 0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y;cursor:grab}
#cv:active{cursor:grabbing}
.cssheart{position:absolute;inset:0;display:grid;place-items:center;perspective:700px;animation:beat 1.6s ease-in-out infinite}
.stack{position:relative;width:62%;aspect-ratio:1;transform-style:preserve-3d;animation:spin 14s linear infinite}
.stack svg{position:absolute;inset:0;width:100%;height:100%;transform:translateZ(calc((var(--i) - 11) * 4px)) scale(var(--s));fill:var(--pt1);fill-opacity:.55;stroke:var(--pt2);stroke-width:.3;stroke-opacity:.7}
.stack svg:nth-child(3n){fill:var(--pt2);fill-opacity:.4}
html.ready .cssheart{display:none}
@keyframes spin{to{transform:rotateY(360deg)}}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.06)}28%{transform:scale(1)}42%{transform:scale(1.04)}}

.msg{max-width:32rem;margin:.6rem auto 0;padding:0 1.5rem;text-align:center;font:400 clamp(1.3rem,4.8vw,1.65rem)/2 Amiri,"Traditional Arabic",serif;color:var(--deep)}
.msg::before{content:var(--msg)}

/* الجاليري: 6 صور، كل اتنين جمب بعض */
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:1.8rem 1rem;max-width:34rem;margin:3.5rem auto 0;padding:0 1rem}
h2.t{grid-column:1/-1;margin:0;text-align:center;font:700 1.6rem Amiri,"Traditional Arabic",serif;color:var(--dust)}
.fr{margin:0;padding:.5rem .5rem .8rem;background:var(--card);border:1px solid var(--rose);border-radius:3px;box-shadow:0 10px 28px var(--sh)}
.fr:nth-of-type(odd){rotate:-2deg}
.fr:nth-of-type(even){rotate:2deg}
.ph{aspect-ratio:4/5;background-size:cover;background-position:center;border:1px solid var(--gold)}
.p1{background-image:var(--photo1),linear-gradient(135deg,var(--rose),var(--bg))}
.p2{background-image:var(--photo2),linear-gradient(135deg,var(--rose),var(--bg))}
.p3{background-image:var(--photo3),linear-gradient(135deg,var(--rose),var(--bg))}
.p4{background-image:var(--photo4),linear-gradient(135deg,var(--rose),var(--bg))}
.p5{background-image:var(--photo5),linear-gradient(135deg,var(--rose),var(--bg))}
.p6{background-image:var(--photo6),linear-gradient(135deg,var(--rose),var(--bg))}
figcaption{margin-top:.6rem;text-align:center;font:400 1.1rem/1.7 Amiri,"Traditional Arabic",serif;color:var(--deep)}
.c1::before{content:var(--cap1)}.c2::before{content:var(--cap2)}.c3::before{content:var(--cap3)}
.c4::before{content:var(--cap4)}.c5::before{content:var(--cap5)}.c6::before{content:var(--cap6)}

footer{padding:3.5rem 1rem 1.5rem;text-align:center;color:var(--mute);font-size:1.4rem}
.song{padding:0 1rem 3.5rem;text-align:center}

@media(prefers-reduced-motion:reduce){
  .cssheart{animation:none}
  .stack{animation:none;transform:rotateY(24deg)}
  .intro{transition:none}
}
</style>
</head>

<script>
(function(){
  var C=window.CONFIG||{},root=document.documentElement,reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var open=document.getElementById("open");

  /* عداد حي: أيام وساعات ودقايق وثواني */
  if(C.START_DATE){
    var s0=new Date(C.START_DATE+"T00:00:00"),els=["days","hh","mm","ss"].map(function(x){return document.getElementById(x)});
    var tick=function(){
      var t=Math.floor((Date.now()-s0)/1000);if(isNaN(t)||t<0)return;
      var v=[Math.floor(t/86400),Math.floor(t%86400/3600),Math.floor(t%3600/60),t%60];
      for(var j=0;j<4;j++)els[j].textContent=v[j].toLocaleString("ar-EG");
      document.getElementById("count").hidden=false;
    };
    tick();setInterval(tick,1000);
  }

  /* القلب على canvas */
  var cv=document.getElementById("cv"),cx=cv.getContext&&cv.getContext("2d");
  var G=[[],[]],W=0,H=0,ry=0,rx=-.15,vy=.006,drag=false,lx=0,ly=0,started=false,col=["#b9707a","#b08a4e"];
  if(cx){
    for(var i=0;i<1900;i++){
      var t=Math.random()*6.2832,r=Math.random()<.6?.86+.14*Math.random():Math.sqrt(Math.random());
      var hx=16*Math.pow(Math.sin(t),3),hy=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
      var z=(Math.random()-.5)*2*9*Math.sqrt(1-.9*r*r);
      G[Math.random()<.3?1:0].push([hx*r,-(hy*r+2.5),z]);
    }
  }
  function colors(){var cs=getComputedStyle(root);col=[cs.getPropertyValue("--pt1").trim()||col[0],cs.getPropertyValue("--pt2").trim()||col[1]]}
  function size(){
    var b=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);
    W=b.width;H=b.height;if(!W)return;
    cv.width=Math.round(W*d);cv.height=Math.round(H*d);cx.setTransform(d,0,0,d,0,0);
  }
  function draw(now){
    if(!W)return;
    var b=reduce?1:1+.05*Math.pow(Math.abs(Math.sin(now*.00196)),14);
    var s=Math.min(W,H)/40*b,cy=Math.cos(ry),sy=Math.sin(ry),cX=Math.cos(rx),sX=Math.sin(rx),m=W/2,n=H/2,k,g,i,p,x,y,z,f,q;
    cx.clearRect(0,0,W,H);
    for(k=0;k<2;k++){
      cx.fillStyle=col[k];g=G[k];
      for(i=0;i<g.length;i++){
        p=g[i];x=p[0]*cy+p[2]*sy;z=p[2]*cy-p[0]*sy;
        y=p[1]*cX-z*sX;z=p[1]*sX+z*cX;f=70/(70+z);
        cx.globalAlpha=Math.max(.25,Math.min(1,.65-z/24));
        q=1.1+.7*f;cx.fillRect(m+x*s*f-q/2,n+y*s*f-q/2,q,q);
      }
    }
    cx.globalAlpha=1;
  }
  function loop(now){
    if(!drag){ry+=vy;vy+=(.006-vy)*.03;rx+=(-.15-rx)*.03}
    draw(now);requestAnimationFrame(loop);
  }
  function start(){
    if(started||!cx)return;
    colors();size();if(!W)return;
    started=true;root.classList.add("ready");
    if(reduce){ry=.5;draw(0)}else{requestAnimationFrame(loop)}
  }
  cv.addEventListener("pointerdown",function(e){drag=true;lx=e.clientX;ly=e.clientY;try{cv.setPointerCapture(e.pointerId)}catch(_){}});
  cv.addEventListener("pointermove",function(e){
    if(!drag)return;
    var dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;
    ry+=dx*.012;vy=dx*.012;rx=Math.max(-.7,Math.min(.7,rx+dy*.008));
    if(reduce)draw(0);
  });
  function up(){drag=false}
  cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
  window.addEventListener("resize",function(){if(started){size();if(reduce)draw(0)}});
  var mq=matchMedia("(prefers-color-scheme: dark)");
  if(mq.addEventListener)mq.addEventListener("change",function(){colors();if(reduce&&started)draw(0)});

  /* فتح المفاجأة */
  function opened(){if(!open.checked)return;window.scrollTo(0,0);start()}
  open.addEventListener("change",opened);
  open.addEventListener("keydown",function(e){if(e.key==="Enter"){open.checked=true;opened()}});
  if(open.checked)start();
})();
</script>
